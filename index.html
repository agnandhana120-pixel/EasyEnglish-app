<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyEnglish - Smart Translator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5ff;color:#172554}
header{background:linear-gradient(120deg,#3730a3,#6366f1);color:white;text-align:center;padding:35px 15px}
.container{max-width:850px;margin:30px auto;padding:20px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0001}
label{display:block;font-weight:bold;margin:15px 0 8px}
select,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
textarea{min-height:120px}
button{padding:13px 18px;background:#4f46e5;color:white;border:0;border-radius:9px;margin:10px 5px 0 0;cursor:pointer}
button:hover{background:#3730a3}
#output{background:#eef2ff;padding:17px;margin-top:12px;border-radius:10px;min-height:100px;white-space:pre-wrap}
#status{color:#475569}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>

<header>
<h1>🌍 EasyEnglish</h1>
<p>Understand every language. Communicate with confidence.</p>
</header>

<div class="container">
<div class="card">

<h2>Language Translator</h2>
<p>Translate your language into easy English.</p>

<label>Choose your language:</label>
<select id="language">
<option value="ta">Tamil</option>
<option value="hi">Hindi</option>
<option value="te">Telugu</option>
<option value="ml">Malayalam</option>
<option value="kn">Kannada</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
<option value="ja">Japanese</option>
<option value="zh">Chinese</option>
<option value="ar">Arabic</option>
</select>

<label>Enter your sentence:</label>
<textarea id="inputText" placeholder="Type your sentence here..."></textarea>

<button onclick="translateText()">Translate to English</button>
<button onclick="startVoice()">🎤 Speak</button>

<hr>

<h2>Easy English Converter</h2>

<label>Choose English variety:</label>
<select id="accent">
<option value="international">Simple International English</option>
<option value="american">American English</option>
<option value="british">British English</option>
<option value="indian">Indian English</option>
<option value="australian">Australian English</option>
</select>

<h3>Converted result:</h3>
<div id="output">Your result will appear here.</div>

<button onclick="simplifyText()">Make Easy English</button>
<button onclick="speakResult()">🔊 Listen</button>
<button onclick="copyResult()">Copy Result</button>

<p id="status" aria-live="polite"></p>

</div>
</div>

<footer>EasyEnglish © 2026 | Breaking Language Barriers</footer>

<script>
async function translateText(){
 const text=document.getElementById("inputText").value.trim();
 const lang=document.getElementById("language").value;
 const status=document.getElementById("status");

 if(!text){status.textContent="Please enter text.";return;}
 if(text.length>450){status.textContent="Please use fewer than 450 characters.";return;}

 status.textContent="Translating...";

 try{
  const url="https://api.mymemory.translated.net/get?q="+
  encodeURIComponent(text)+"&langpair="+lang+"|en";
  const response=await fetch(url);
  if(!response.ok)throw new Error();
  const data=await response.json();
  if(data.responseStatus!==200)throw new Error();

  document.getElementById("output").textContent=
  data.responseData.translatedText;
  status.textContent="Translation completed!";
 }catch(e){
  status.textContent="Translation failed. Please try again.";
 }
}

function simplifyText(){
 let text=document.getElementById("inputText").value.trim();
 const status=document.getElementById("status");

 if(!text){status.textContent="Please enter a sentence.";return;}

 const words={
  commence:"start",terminate:"end",purchase:"buy",
  assist:"help",utilize:"use",approximately:"about",
  require:"need",demonstrate:"show",inquire:"ask",
  numerous:"many",difficult:"hard",additional:"extra",
  sufficient:"enough",obtain:"get",residence:"home",
  inform:"tell",depart:"leave",comprehend:"understand"
 };

 for(const [word,simple] of Object.entries(words)){
  text=text.replace(new RegExp("\\b"+word+"\\b","gi"),simple);
 }

 const accent=document.getElementById("accent").value;

 const vocabulary={
  american:{flat:"apartment",lift:"elevator",petrol:"gas",holiday:"vacation"},
  british:{apartment:"flat",elevator:"lift",gasoline:"petrol",vacation:"holiday"},
  australian:{apartment:"flat",elevator:"lift",gasoline:"petrol",vacation:"holiday"},
  indian:{},
  international:{}
 };

 for(const [word,replacement] of Object.entries(vocabulary[accent])){
  text=text.replace(new RegExp("\\b"+word+"\\b","gi"),replacement);
 }

 document.getElementById("output").textContent=text;
 status.textContent="Easy English conversion completed!";
}

function startVoice(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 const status=document.getElementById("status");
 if(!Speech){status.textContent="Voice recognition is not supported in this browser.";return;}

 const recognition=new Speech();
 const languages={ta:"ta-IN",hi:"hi-IN",te:"te-IN",ml:"ml-IN",kn:"kn-IN",fr:"fr-FR",es:"es-ES",de:"de-DE",ja:"ja-JP",zh:"zh-CN",ar:"ar-SA"};
 recognition.lang=languages[document.getElementById("language").value]||"en-US";
 recognition.onresult=e=>{
  document.getElementById("inputText").value=e.results[0][0].transcript;
  status.textContent="Speech converted into text.";
 };
 recognition.onerror=()=>status.textContent="Voice recognition failed.";
 status.textContent="Listening...";
 recognition.start();
}

function speakResult(){
 const text=document.getElementById("output").textContent;
 if(!text||text==="Your result will appear here.")return;
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="en-US";
 window.speechSynthesis.speak(speech);
}

function copyResult(){
 navigator.clipboard.writeText(document.getElementById("output").textContent)
 .then(()=>document.getElementById("status").textContent="Copied!")
 .catch(()=>document.getElementById("status").textContent="Copy failed.");
}
</script>
</body>
</html>
